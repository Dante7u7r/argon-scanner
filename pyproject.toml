[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argon-architecture-scanner"
version = "0.9.3"
description = "Pre-1.0 token-budgeted architecture context engine for AI coding assistants."
authors = [{ name = "Dante7u7r" }]
readme = "docs/README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.12.0",
    "pathspec>=1.1.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-language-pack>=0.10.0",
    "mcp>=1.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "playwright>=1.59.0",
]
semantic = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
argon = "argon:main"
argon-view = "argon_view:main"
argon-mcp = "argon_mcp:main"
argon-watch = "argon_watch:main"
argon-quality-bench = "argon_quality_bench:main"

[tool.setuptools]
py-modules = ["argon", "argon_bench", "argon_deps", "argon_laravel", "argon_mcp", "argon_quality_bench", "argon_semantic", "argon_view", "argon_watch"]
