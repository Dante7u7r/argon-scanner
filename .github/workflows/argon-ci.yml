name: ARGON Architecture Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  architecture-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Initialize ARGON baseline
        run: argon ci init --root .

      - name: Check architecture quality
        run: |
          argon ci check --root . --output argon_ci_report.md
          if [ $? -ne 0 ]; then
            echo "Architecture quality gate FAILED"
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: argon-ci-report
          path: argon_ci_report.md

  argon-quality-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run quality benchmarks
        run: python -m argon_quality_bench --output bench_results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: argon-bench-results
          path: bench_results.json
